name: 更新營造成本看板

on:
  schedule:
    # 每月 1 號台灣時間早上 8 點執行（UTC 0 點 = 台灣早上 8 點）
    - cron: "0 0 1 * *"
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動按「Run workflow」立即更新

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install requests

      - name: 產生看板 HTML
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python build_dashboard.py

      - name: 發布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: false
